    <rect x="1" y="1" width="142" height="142" rx="33" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <g transform="translate(24 24) scale(4)">
      <path d="M2 12.5h4.5L9 6l5.5 12L17 12.5h5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="312" y="160" fill="#f4f3ff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5">Logwatch Dashboard</text>
  <text x="314" y="210" fill="#b9b4e6" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26">Logs, alerts and edge traffic in, a short to-do list out.</text>
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#d9d5ff">
