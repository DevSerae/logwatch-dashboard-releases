<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block t %}{% endblock %} · {{ title }}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%239085e9'/%3E%3C/svg%3E">
<style>
  body { margin:0; background:#0f1115; color:#e4e7eb; font:14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:860px; margin:0 auto; padding:28px 18px 60px; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  header h1 { font-size:18px; font-weight:600; margin:0; display:flex; align-items:center; gap:8px; flex:1; }
  header h1 i { width:12px; height:12px; border-radius:50%; background:#9085e9; display:inline-block; }
  header a, header button { color:#98a0aa; font-size:13px; text-decoration:none; background:none; border:0; cursor:pointer; font-family:inherit; font-weight:400; padding:0; margin:0; }
  header a:hover, header button:hover { color:#e4e7eb; }
  section { background:#171a21; border:1px solid #262a33; border-radius:10px; padding:18px 20px; margin-bottom:14px; }
  h2 { font-size:15px; font-weight:600; margin:0 0 10px; } h3 { font-size:13px; margin:16px 0 6px; color:#c3c8cf; }
  p { line-height:1.5; margin:6px 0; } .d { color:#98a0aa; font-size:13px; }
  label { display:block; color:#98a0aa; font-size:12px; margin:10px 0 4px; }
  input, select { box-sizing:border-box; padding:7px 9px; background:#0f1115; color:#e4e7eb; border:1px solid #2e333d; border-radius:6px; font:inherit; }
  input:focus, select:focus { outline:none; border-color:#9085e9; }
  input[type=checkbox] { width:auto; vertical-align:middle; margin-right:6px; }
  .w100 { width:100%; } .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:0 12px; }
  button { padding:7px 13px; background:#9085e9; color:#0f1115; border:0; border-radius:6px; font:600 13px system-ui, sans-serif; cursor:pointer; margin-top:12px; }
  button:hover { background:#a297f0; } button.g { background:#262a33; color:#e4e7eb; font-weight:500; } button.g:hover { background:#2e333d; }
  button.r { background:#3a1f24; color:#ff8787; } button.r:hover { background:#4a2329; } button.sm { margin:0; padding:4px 9px; font-size:12px; }
  .msg { background:#1c2a22; border:1px solid #2b5a3d; color:#8ce99a; padding:10px 14px; border-radius:8px; margin-bottom:14px; }
  .err { background:#2a1c1f; border:1px solid #5a2b33; color:#ff8787; padding:10px 14px; border-radius:8px; margin-bottom:14px; }
  code, .mono { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; } code { background:#0f1115; padding:1px 5px; border-radius:4px; }
  table { width:100%; border-collapse:collapse; font-size:13px; } th { text-align:left; color:#98a0aa; font-weight:500; padding:6px 8px; border-bottom:1px solid #262a33; }
  td { padding:7px 8px; border-bottom:1px solid #1f232b; vertical-align:top; } tr:last-child td { border-bottom:0; }
  .pill { display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px; background:#262a33; color:#c3c8cf; }
  .pill.a { background:#2c2752; color:#b9b0ff; } .pill.ok { background:#1c2a22; color:#8ce99a; } .pill.no { background:#2a1c1f; color:#ff8787; }
  details { margin-top:6px; } summary { cursor:pointer; color:#98a0aa; font-size:12px; } details form { margin:6px 0; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  details form button { margin:0; } .codes { display:grid; grid-template-columns:repeat(2, max-content); gap:4px 24px; font:15px ui-monospace, monospace; padding:10px 0; }
  .qr svg { width:180px; height:180px; background:#fff; border-radius:6px; }
</style></head>
<body><main>
<header><h1><i></i>{% block h %}{% endblock %}</h1>
  <a href="/">← Board</a>{% if role == "admin" %}<a href="/users">Users &amp; sign-in</a>{% endif %}<a href="/account">Account</a>
  <form method="post" action="/logout" style="display:inline"><button>Sign out</button></form></header>
{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}{% if err %}<div class="err">{{ err }}</div>{% endif %}
{% block body %}{% endblock %}
</main></body></html>
